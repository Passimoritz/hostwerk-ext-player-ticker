<g transform="translate(898 104) scale(2.85)"><ellipse class="bbsd" cx="32" cy="55" rx="19" ry="2.8" fill="#000" opacity=".32"/><g class="bbfl"><g class="bbri" style="animation-duration:3.6s"><rect x="8" y="24" width="15" height="15" rx="2" fill="#8a5a33"/><rect x="8" y="24" width="15" height="5" fill="#3b2a1a"/><rect x="11" y="31" width="3" height="3" fill="#fff"/><rect x="17" y="31" width="3" height="3" fill="#fff"/></g><rect x="22" y="18" width="20" height="20" rx="2.5" fill="#c68b59"/><rect x="22" y="18" width="20" height="6" fill="#4a2f1a"/><rect x="26" y="27" width="4" height="4" fill="#fff"/><rect x="34" y="27" width="4" height="4" fill="#fff"/><rect x="27" y="28" width="2" height="2" fill="#3060c0"/><rect x="35" y="28" width="2" height="2" fill="#3060c0"/><rect x="28" y="33" width="8" height="2" fill="#7a4a2a"/><g class="bbri" style="animation-duration:3.6s;animation-delay:1.8s"><rect x="41" y="24" width="15" height="15" rx="2" fill="#e8b98a"/><rect x="41" y="24" width="15" height="5" fill="#d9a441"/><rect x="44" y="31" width="3" height="3" fill="#fff"/><rect x="50" y="31" width="3" height="3" fill="#fff"/></g><rect x="17" y="41" width="30" height="7" rx="3.5" fill="url(#bbm)"/><circle class="bbbl" cx="22" cy="44.5" r="1.8" fill="#5dff9b"/><rect x="26" y="43.5" width="16" height="2" rx="1" fill="#fff" opacity=".7"/></g></g>
</g>
